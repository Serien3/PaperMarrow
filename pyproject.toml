[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-marrow"
version = "0.2.0"
description = "Import Zotero papers into an Obsidian vault and convert PDFs to Markdown"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["obsidian", "research", "zotero"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mineru-open-sdk==0.2.5",
    "prompt-toolkit>=3.0.52,<4",
    "python-dotenv==1.0.1",
    "PyYAML>=6.0,<7",
]

[project.scripts]
papermarrow = "paper_marrow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_marrow*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
